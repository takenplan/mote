name: Owner requested frozen release 2026-10-21
on:
  workflow_dispatch:
    inputs:
      owner_decision:
        description: 'Publish frozen 561f packages with documented regression failures'
        required: true
        type: choice
        options: ['publish-561f-with-documented-known-issues']
permissions:
  contents: read
concurrency:
  group: mote-owner-frozen-release-20261021
  cancel-in-progress: false
env:
  MOTE_BUILD_PROFILE: prod
  FROZEN_SOURCE: 561f0627acbe36b4f13656e1501471c22685c1a0
jobs:
  package-and-publish:
    name: Frozen ${{ matrix.component }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: central, runner: ubuntu-24.04, tag: central-v0.0.91, limit: 30 }
          - { component: desktop, runner: macos-15, tag: desktop-v0.0.89, limit: 45 }
          - { component: android, runner: ubuntu-24.04, tag: android-v0.0.90, limit: 50 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.limit }}
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_COMPONENT: ${{ matrix.component }}
      RELEASE_TAG: ${{ matrix.tag }}
      COORDINATION_COMMIT: ${{ github.sha }}
      OWNER_DECISION: ${{ inputs.owner_decision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 561f0627acbe36b4f13656e1501471c22685c1a0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - name: Verify frozen source, immutable tag and explicit owner decision
        shell: bash
        run: |
          test "$OWNER_DECISION" = publish-561f-with-documented-known-issues
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = 82415395bd9e87fa5e40646ea92eee950514043f
          test "$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)" = "$FROZEN_SOURCE"
          git diff --exit-code
          GITHUB_REF="refs/tags/$RELEASE_TAG" npm run release:verify -- "$RELEASE_COMPONENT"
          echo 'Owner exception: complete regression checks are not run; failed results remain open.'
      - name: Prepare Central build dependencies
        if: matrix.component == 'central'
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3
          npm run build:central
      - name: Package committed Central source and verify archive metadata
        if: matrix.component == 'central'
        run: GITHUB_REF="refs/tags/$RELEASE_TAG" node scripts/release/source-package.mjs
      - name: Prepare Desktop build dependencies
        if: matrix.component == 'desktop'
        run: |
          npm ci
          npm run build:libs
      - name: Build and verify actual Mac package
        if: matrix.component == 'desktop'
        env:
          MOTE_PRE_RELEASE_CHECKS: 'true'
          MOTE_MAC_SIGNING_MODE: ${{ vars.MOTE_MAC_SIGNING_MODE || 'adhoc' }}
          CSC_LINK: ${{ secrets.MOTE_MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MOTE_MAC_CERTIFICATE_PASSWORD }}
          MOTE_APPLE_TEAM_ID: ${{ vars.MOTE_APPLE_TEAM_ID }}
          MOTE_APPLE_API_KEY_P8: ${{ secrets.MOTE_APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.MOTE_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MOTE_APPLE_API_ISSUER }}
        run: node scripts/release/mac-package.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.component == 'android'
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: matrix.component == 'android'
        with: { packages: platform-tools }
      - name: Prepare Android SDK and persistent signing identity
        if: matrix.component == 'android'
        env:
          MOTE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOTE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          node scripts/release/prepare-android-signing.mjs
      - name: Assemble signed production APK
        if: matrix.component == 'android'
        env:
          MOTE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOTE_ANDROID_KEYSTORE_PASSWORD }}
          MOTE_ANDROID_KEY_ALIAS: ${{ secrets.MOTE_ANDROID_KEY_ALIAS }}
          MOTE_ANDROID_KEY_PASSWORD: ${{ secrets.MOTE_ANDROID_KEY_PASSWORD }}
        run: apps/android/gradlew -p apps/android --no-daemon assembleRelease
      - name: Verify actual APK identity, certificate and 16 KiB alignment
        if: matrix.component == 'android'
        run: node scripts/release/asset-metadata.mjs android apps/android/app/build/outputs/apk/release/app-release.apk
      - name: Remove runner signing material
        if: always() && matrix.component == 'android'
        run: node -e "require('node:fs').rmSync(require('node:path').join(process.env.RUNNER_TEMP,'mote-release-signing'),{recursive:true,force:true})"
      - name: Retain verified package and provenance metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-release-${{ matrix.component }}-561f0627
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7
      - name: Append owner decision and unresolved issues to public release notes
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { loadComponent } from './scripts/release/components.mjs';
          const release = loadComponent(process.env.RELEASE_COMPONENT);
          const doc = `https://github.com/utopiafar/mote/blob/${process.env.COORDINATION_COMMIT}/docs/validation/performance-round1-release-known-issues-2026-10-21.md`;
          appendFileSync(release.notes, `\n\n## Known issues and owner release decision\n\nThe owner requested this frozen-source release without further regression iterations. Complete local acceptance passed previously; subsequent Release CI reported unresolved Central Memory, Desktop wheel/large-OCR and Android fixture-startup failures. Those failures remain open. This packaging run intentionally skips complete regression suites and retains actual build, signature, package identity and integrity checks. Physical-device, live-model and deployment validation were not run.\n\n[Full issue log and validation limits](${doc}). Source commit: ${process.env.FROZEN_SOURCE}.\n`);
          JS
      - name: Publish verified frozen package with documented validation exception
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: GITHUB_REF="refs/tags/$RELEASE_TAG" node scripts/release/publish.mjs "$RELEASE_COMPONENT"
