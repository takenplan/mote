name: Release Desktop
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      profile:
        description: 'Branch build profile (release tags always use prod)'
        type: choice
        options: [dev, prod]
        default: dev
env:
  MOTE_BUILD_PROFILE: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || inputs.profile || 'dev' }}
permissions:
  contents: read
concurrency:
  group: mote-release-desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      profile: ${{ steps.version.outputs.profile }}
      build_id: ${{ steps.version.outputs.build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - id: version
        run: npm run release:verify -- desktop
  package:
    needs: version
    runs-on: macos-15
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Build desktop workspace dependencies
        run: npm run build:libs
      - name: Verify desktop workspaces and generated fixtures
        run: npm run check:desktop
      - name: Build and verify the selected Mac profile
        env:
          MOTE_PRE_RELEASE_CHECKS: 'true'
          MOTE_MAC_SIGNING_MODE: ${{ vars.MOTE_MAC_SIGNING_MODE || 'adhoc' }}
          CSC_LINK: ${{ secrets.MOTE_MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MOTE_MAC_CERTIFICATE_PASSWORD }}
          MOTE_APPLE_TEAM_ID: ${{ vars.MOTE_APPLE_TEAM_ID }}
          MOTE_APPLE_API_KEY_P8: ${{ secrets.MOTE_APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.MOTE_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MOTE_APPLE_API_ISSUER }}
        run: node scripts/release/mac-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "${{ needs.version.outputs.build_id }}", path: artifacts/release/*, if-no-files-found: error, retention-days: 7 }
  publish:
    if: needs.version.outputs.profile == 'prod'
    needs: [version, package]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "${{ needs.version.outputs.build_id }}", path: artifacts/release }
      - name: Publish verified desktop Beta or stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish.mjs desktop
  publish-dev:
    if: needs.version.outputs.profile == 'dev' && github.ref == 'refs/heads/main'
    needs: [version, package]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "${{ needs.version.outputs.build_id }}", path: artifacts/release }
      - name: Publish immutable Desktop Dev prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/desktop/scripts/publish-dev.mjs
