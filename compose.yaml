name: ${MOTE_COMPOSE_PROJECT:?Use node scripts/mote.mjs compose with a profile}
services:
  storage-init:
    image: ${MOTE_IMAGE:?Profile image is required}
    user: "0:0"
    restart: "no"
    command: ["node", "scripts/storage-owner-entry.mjs", "${MOTE_CONTAINER_USER:?Profile owner is required}", "/data", "${MOTE_MODELS_DIRECTORY:?Configured model directory is required}", "/worker-facts"]
    volumes:
      - mote-data:/data
      - mote-models:${MOTE_MODELS_DIRECTORY:?Configured model directory is required}
      - mote-worker-facts:/worker-facts
    network_mode: none
  mote:
    image: ${MOTE_IMAGE:?Profile image is required}
    build: .
    user: ${MOTE_CONTAINER_USER:?Profile owner is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOTE_PORT:?Profile port is required}:${MOTE_PORT:?Profile port is required}"
    env_file:
      - path: ${MOTE_DOCKER_ENV_FILE:?Generated secret environment is required}
        format: raw
    environment:
      MOTE_CONFIG_FILE: /config/mote.yaml
    volumes:
      - mote-data:/data
      - mote-models:${MOTE_MODELS_DIRECTORY:?Configured model directory is required}
      # Mount the parent directory so an atomic YAML replacement remains visible.
      - type: bind
        source: ${MOTE_CONFIG_DIRECTORY:?Profile configuration directory is required}
        target: /config
    depends_on:
      storage-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  ocr-worker:
    image: ${MOTE_IMAGE:?Profile image is required}
    user: ${MOTE_CONTAINER_USER:?Profile owner is required}
    restart: unless-stopped
    network_mode: "service:mote"
    depends_on:
      mote:
        condition: service_started
    env_file:
      - path: ${MOTE_DOCKER_ENV_FILE:?Generated secret environment is required}
        format: raw
    environment:
      MOTE_CONFIG_FILE: /config/mote.yaml
    volumes:
      - mote-models:${MOTE_MODELS_DIRECTORY:?Configured model directory is required}:ro
      - mote-worker-facts:/worker-facts
      - type: bind
        source: ${MOTE_CONFIG_DIRECTORY:?Profile configuration directory is required}
        target: /config
        read_only: true
    command: ["node", "scripts/media-worker-entry.mjs", "ocr"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
  asr-worker:
    extends: ocr-worker
    command: ["node", "scripts/media-worker-entry.mjs", "asr"]
volumes:
  mote-worker-facts:
    name: ${MOTE_VOLUME:?Profile-specific volume is required}-worker-facts
  mote-data:
    name: ${MOTE_VOLUME:?Profile-specific volume is required}
  mote-models:
    name: ${MOTE_MODELS_VOLUME:?Profile-specific models volume is required}
